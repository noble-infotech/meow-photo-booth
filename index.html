<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Meow Cakes — Photo Booth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --lilac:#F3E7FA; --plum:#5B2B82; --plum-deep:#42205F; --gold:#C9A24B; --blush:#EBC7E4; }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--plum-deep); color:var(--lilac);
    font-family:'Quicksand',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:env(safe-area-inset-top,0) 14px calc(env(safe-area-inset-bottom,0) + 14px);
    overscroll-behavior:none;
  }
  .wrap{width:100%;max-width:440px;flex:1;display:flex;flex-direction:column;gap:14px;padding-top:14px}
  #view{width:100%;height:auto;display:block;border-radius:20px;box-shadow:0 18px 44px rgba(0,0,0,.4);background:var(--lilac)}
  #video{position:fixed;left:0;top:0;width:160px;height:160px;opacity:.01;z-index:-1;pointer-events:none}

  .controls{display:flex;align-items:center;justify-content:center;gap:26px;padding:4px 0 6px}
  .shutter{
    width:76px;height:76px;border-radius:50%;border:4px solid var(--lilac);
    background:transparent;cursor:pointer;display:grid;place-items:center;
    font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--lilac);
    transition:transform .12s ease,background .12s ease;
  }
  .shutter:active{transform:scale(.93);background:rgba(243,231,250,.2)}
  .ghost{
    min-width:52px;height:52px;padding:0 16px;border-radius:26px;cursor:pointer;
    border:1px solid rgba(243,231,250,.45);background:transparent;color:var(--lilac);
    font-family:inherit;font-size:14px;font-weight:600;
  }
  .ghost:active{background:rgba(243,231,250,.16)}
  .primary{background:var(--lilac);color:var(--plum);border-color:var(--lilac)}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  #doneControls{flex-wrap:wrap;gap:12px}
  .ig{flex-basis:100%;border:0;color:#fff;background:linear-gradient(45deg,#f09433,#dc2743 50%,#bc1888)}
  .hidden{display:none!important}
  .note{text-align:center;font-size:13px;color:var(--blush);line-height:1.5;padding:0 6px}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="view" width="1080" height="1350"></canvas>
  <video id="video" playsinline autoplay muted></video>

  <div class="controls" id="liveControls">
    <button class="ghost" id="flipBtn" title="Switch camera">Flip</button>
    <button class="shutter" id="capBtn">CAPTURE</button>
    <button class="ghost" id="timerBtn" title="3 second timer">3s</button>
  </div>

  <div class="controls hidden" id="doneControls">
    <button class="ghost" id="retakeBtn">Retake</button>
    <button class="ghost primary" id="saveBtn">Save photo</button>
    <button class="ghost" id="shareBtn">Share</button>
    <button class="ghost ig" id="igBtn">Share to Instagram</button>
  </div>

  <p class="note" id="note">Allow camera access to start.</p>
  <button class="ghost primary" id="camBtn" style="display:none;align-self:center">Open phone camera</button>
  <input type="file" id="fileIn" accept="image/*" capture="user" class="hidden">
</div>

<script>
/* =======================================================================
   CONFIG
   ======================================================================= */
const CONFIG = {
  logoSrc: "./meow.jpg?v=2",
  fileName: "meow-cakes",
  colors  : { light:"#F3E7FA", plum:"#5B2B82", soft:"#8B5BB5", blush:"#EBC7E4", gold:"#C9A24B" },
  instagramHandle: "",   // e.g. "meowcakes_surandai" (without @). Leave "" if not needed
  hashtags: "#MeowCakes #BakeBrewBliss",
  mirrorFront: true
};
/* ===================================================================== */

const $ = id => document.getElementById(id);
const canvas = $("view"), ctx = canvas.getContext("2d"), video = $("video");
const W = canvas.width, H = canvas.height, C = CONFIG.colors;
let facing = "user", stream = null, logoImg = null, busy = false, frozen = false, countdown = 0, still = null;

// Layout: logo badge on top, circular photo window below (badge overlaps the ring)
const PHOTO = { cx:540, cy:832, r:398 };
const BADGE = { cx:540, cy:212, r:178 };

const logo = new Image();
logo.onload = () => { logoImg = logo; };
logo.src = CONFIG.logoSrc;

async function startCamera(){
  stopCamera();
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:facing, width:{ideal:1440}, height:{ideal:1440} }, audio:false
    });
    video.srcObject = stream;
    await video.play().catch(()=>{});
    $("note").textContent = "Frame your shot, then tap capture.";
  }catch(err){
    $("note").textContent = "Camera is blocked. Open this link in Chrome or Safari (not inside Instagram or WhatsApp), allow camera access, or tap the button below.";
    $("camBtn").style.display = "";
  }
}
function stopCamera(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }

/* ---------- little decorations, same vibe as the logo ---------- */
function sparkle(x,y,r,color){
  ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(x,y-r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.quadraticCurveTo(x,y,x,y+r);
  ctx.quadraticCurveTo(x,y,x-r,y); ctx.quadraticCurveTo(x,y,x,y-r); ctx.fill();
}
function heart(x,y,s,color){
  ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(x,y+s*.35);
  ctx.bezierCurveTo(x,y-s*.1,x-s*.6,y-s*.1,x-s*.6,y+s*.25);
  ctx.bezierCurveTo(x-s*.6,y+s*.6,x,y+s*.85,x,y+s);
  ctx.bezierCurveTo(x,y+s*.85,x+s*.6,y+s*.6,x+s*.6,y+s*.25);
  ctx.bezierCurveTo(x+s*.6,y-s*.1,x,y-s*.1,x,y+s*.35); ctx.fill();
}
function paw(x,y,s,color){
  ctx.fillStyle = color;
  const e=(px,py,rx,ry)=>{ctx.beginPath();ctx.ellipse(px,py,rx,ry,0,0,Math.PI*2);ctx.fill();};
  e(x,y+s*.28,s*.55,s*.42);
  e(x-s*.7,y-s*.12,s*.2,s*.28); e(x-s*.26,y-s*.56,s*.2,s*.28);
  e(x+s*.26,y-s*.56,s*.2,s*.28); e(x+s*.7,y-s*.12,s*.2,s*.28);
}

/* ---------- draw one full frame ---------- */
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = C.light; ctx.fillRect(0,0,W,H);

  // decorations
  heart(105,72,64,C.plum);
  sparkle(940,130,40,C.gold);
  paw(965,78,30,C.soft);
  sparkle(150,235,34,C.gold);
  heart(965,335,44,C.soft);
  paw(125,470,44,C.plum);
  paw(955,495,44,C.plum);
  sparkle(46,700,20,C.gold);
  sparkle(1036,690,18,C.gold);
  heart(105,1130,60,C.plum);
  sparkle(985,1215,40,C.gold);
  heart(935,1240,42,C.soft);
  sparkle(160,1275,26,C.gold);

  // Bottom location
ctx.save();

ctx.textAlign = "center";
ctx.textBaseline = "middle";

// Cafe name
ctx.fillStyle = C.plum;
ctx.font = "700 28px Quicksand, sans-serif";
ctx.fillText("MEOW CAKES CAFE & BAKERS", 540, 1300);

// Location
ctx.fillStyle = C.soft;
ctx.font = "600 24px Quicksand, sans-serif";
ctx.fillText("SURANDAI", 540, 1330);

ctx.restore();

  // photo circle
  ctx.save();
  ctx.beginPath(); ctx.arc(PHOTO.cx,PHOTO.cy,PHOTO.r,0,Math.PI*2); ctx.clip();
  ctx.fillStyle = "#2d1740"; ctx.fillRect(0,0,W,H);
  const srcEl = still || video;
  const vw = still ? still.naturalWidth : video.videoWidth;
  const vh = still ? still.naturalHeight : video.videoHeight;
  if(vw && vh){
    const d = PHOTO.r*2, sc = Math.max(d/vw, d/vh);
    const dw = vw*sc, dh = vh*sc;
    if(!still && CONFIG.mirrorFront && facing==="user"){
      ctx.translate(PHOTO.cx*2,0); ctx.scale(-1,1);
    }
    ctx.drawImage(srcEl, PHOTO.cx-dw/2, PHOTO.cy-dh/2, dw, dh);
  }
  ctx.restore();

  // rings — thin gold inside, thick plum outside (like the logo)
  ctx.lineWidth = 6; ctx.strokeStyle = C.gold;
  ctx.beginPath(); ctx.arc(PHOTO.cx,PHOTO.cy,PHOTO.r+16,0,Math.PI*2); ctx.stroke();
  ctx.lineWidth = 26; ctx.strokeStyle = C.plum;
  ctx.beginPath(); ctx.arc(PHOTO.cx,PHOTO.cy,PHOTO.r+42,0,Math.PI*2); ctx.stroke();

  // logo badge
  ctx.fillStyle = C.light;
  ctx.beginPath(); ctx.arc(BADGE.cx,BADGE.cy,BADGE.r+12,0,Math.PI*2); ctx.fill();
  ctx.save();
  ctx.beginPath(); ctx.arc(BADGE.cx,BADGE.cy,BADGE.r,0,Math.PI*2); ctx.clip();
  if(logoImg){
    const sc = (BADGE.r*2)/Math.min(logoImg.width, logoImg.height);
    ctx.drawImage(logoImg, BADGE.cx-logoImg.width*sc/2, BADGE.cy-logoImg.height*sc/2, logoImg.width*sc, logoImg.height*sc);
  }
  ctx.restore();

  // timer number (preview only — cleared before the final capture)
  if(countdown > 0){
    ctx.save();
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "700 300px Quicksand, sans-serif";
    ctx.fillStyle = "rgba(255,255,255,.92)";
    ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 24;
    ctx.fillText(String(countdown), PHOTO.cx, PHOTO.cy+10);
    ctx.restore();
  }
}
function loop(){ if(!frozen) draw(); requestAnimationFrame(loop); }

/* ---------- capture / retake / save / share ---------- */
const wait = ms => new Promise(r=>setTimeout(r,ms));
async function capture(delay){
  if(busy) return;
  if(!stream || !video.videoWidth){
    $("note").textContent = "Camera is not ready. Allow camera permission, or tap the button below to use the phone camera.";
    $("camBtn").style.display = "";
    return;
  }
  busy = true;
  for(let n=delay;n>0;n--){ countdown = n; await wait(1000); }
  countdown = 0;
  draw();               // clean frame, no timer digits
  frozen = true;
  $("liveControls").classList.add("hidden");
  $("doneControls").classList.remove("hidden");
  $("note").textContent = "Save it to your gallery or share it.";
  busy = false;
}
function retake(){
  still = null;
  frozen = false;
  if(!stream) startCamera();
  $("doneControls").classList.add("hidden");
  $("liveControls").classList.remove("hidden");
  $("note").textContent = "Frame your shot, then tap capture.";
}
const toBlob = () => new Promise(res => canvas.toBlob(res, "image/jpeg", 0.92));
async function save(){
  const blob = await toBlob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = CONFIG.fileName + "-" + Date.now() + ".jpg";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
async function share(){
  try{
    const blob = await toBlob();
    const file = new File([blob], CONFIG.fileName + ".jpg", {type:"image/jpeg"});
    if(navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file], title:"Meow Cakes"});
    else await save();
  }catch(e){}
}

/* ---------- Instagram: opens the phone share sheet with the photo attached ---------- */
function caption(){
  const tag = CONFIG.instagramHandle ? " @" + CONFIG.instagramHandle.replace("@","") : "";
  return "Had a lovely time at Meow Cakes!" + tag + " " + CONFIG.hashtags;
}
async function instagram(){
  const text = caption();
  try{ await navigator.clipboard.writeText(text); }catch(e){}   // caption ready to paste
  try{
    const blob = await toBlob();
    const file = new File([blob], CONFIG.fileName + ".jpg", {type:"image/jpeg"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      $("note").textContent = "Pick Instagram (Stories / Feed) from the list. Caption is copied, just paste it.";
      await navigator.share({files:[file], text});
      return;
    }
  }catch(e){
    if(e && e.name === "AbortError") return;   // user closed the sheet
  }
  // Fallback: save the photo, then open the Instagram app
  await save();
  $("note").textContent = "Photo saved and caption copied. Opening Instagram, choose the photo from your gallery.";
  setTimeout(()=>{ window.location.href = "instagram://story-camera"; }, 900);
  setTimeout(()=>{ if(!document.hidden) window.open("https://www.instagram.com/", "_blank"); }, 2800);
}

$("capBtn").onclick   = () => capture(0);
$("timerBtn").onclick = () => capture(3);
$("flipBtn").onclick  = () => { facing = facing==="user" ? "environment" : "user"; startCamera(); };
$("retakeBtn").onclick= retake;
$("camBtn").onclick   = () => $("fileIn").click();
$("fileIn").onchange  = e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const img = new Image();
  img.onload = () => {
    still = img; draw(); frozen = true;
    $("liveControls").classList.add("hidden");
    $("doneControls").classList.remove("hidden");
    $("note").textContent = "Save it to your gallery or share it.";
  };
  img.src = URL.createObjectURL(f);
  e.target.value = "";
};
$("saveBtn").onclick  = save;
$("shareBtn").onclick = share;
$("igBtn").onclick    = instagram;

document.fonts.load("700 300px Quicksand").finally(()=>{ startCamera(); loop(); });
document.addEventListener("visibilitychange", () => {
  if(document.hidden) stopCamera();
  else if(!frozen) startCamera();
});
</script>
</body>
</html>
